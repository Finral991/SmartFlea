<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilSide — Recommended</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000 url('images/RSP.gif') repeat;color:#fff;font:15px Arial,sans-serif}.app{width:min(96vw,1240px);min-height:100vh;margin:auto;padding:14px;background:rgba(0,0,0,.94);border-left:2px solid #fff;border-right:2px solid #fff}.header{display:flex;align-items:center;gap:10px;padding:5px 9px;border:2px solid #fff}.brand{display:flex;align-items:center;gap:7px;color:#fff;text-decoration:none;font-weight:bold}.brand img{width:47px;height:35px;object-fit:cover}nav{margin-left:auto;display:flex;gap:18px;align-items:center}nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:bold}.title{text-align:center;margin:16px 0 9px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:5px;border:2px solid #fff;background:#fff;color:#111;text-align:left;cursor:pointer}.card:hover{outline:2px solid #b9e2de}.card img{display:block;width:100%;aspect-ratio:1/.78;object-fit:cover}.card strong,.card small{display:block}.card strong{margin-top:5px}.card small{margin-top:3px;color:#555}.detail[hidden],.feed[hidden]{display:none}.back{margin:12px 0;border:0;background:transparent;color:#fff;font-weight:bold;cursor:pointer}.post{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr);gap:14px}.post>img,.info{width:100%;min-height:350px;border:2px solid #fff}.post>img{object-fit:cover}.info{padding:14px;background:#080808}.info h1{margin:0 0 12px}.keywords{margin-top:15px;color:#b9e2de;font-size:12px}.similar{margin:16px 0}.comments{max-width:860px;margin:20px auto}.comment{margin:8px 0;padding:9px;border-left:2px solid #b9e2de;background:#181818}.comment small{color:#bbb}.comment button{float:right}.comment-form{display:grid;gap:8px}.comment-form textarea{width:100%;min-height:76px;border:2px solid #fff;border-radius:14px;background:#666;color:#fff;padding:9px;font:inherit}.button{padding:5px 12px;border:1px solid #fff;border-radius:14px;background:#777;color:#fff;font-weight:bold;cursor:pointer}.empty{padding:25px;text-align:center;color:#bbb}@media(max-width:700px){.app{width:100%;border:0;padding:8px}.post{grid-template-columns:1fr}.post>img,.info{min-height:0}.post>img{height:300px}.grid{gap:7px}.card{padding:3px}.card strong{font-size:11px}nav{gap:8px}nav a{font-size:9px}}
</style></head><body><div class="app"><header class="header"><a class="brand" href="index.html"><img src="images/logo.jpg">VEILSIDE</a><nav><a href="index.html">HOME</a><a href="views/about.html">CHATS</a><span data-account-nav><a href="views/login.html">LOG IN</a></span></nav></header><main><section id="feed" class="feed"><h1 class="title">RECOMMENDED</h1><div id="grid" class="grid"></div></section><section id="detail" class="detail" hidden><button id="back" class="back">← BACK TO RECOMMENDED</button><article id="post" class="post"></article><section class="similar"><h2 class="title">SIMILAR FOR YOU</h2><div id="similar" class="grid"></div></section><section class="comments"><h2 class="title">COMMENTS</h2><form id="comment-form" class="comment-form"><textarea id="comment" placeholder="Write a comment…"></textarea><button class="button">Submit</button></form><div id="comment-list"></div></section></section></main></div><script type="module">import {auth,db,doc,getDoc,onAuthStateChanged,collection,addDoc,deleteDoc,getDocs,query,orderBy,onSnapshot,serverTimestamp} from './firebase.js';import {attachAccountNav} from './account-nav.js';attachAccountNav('');const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let me,profile,posts=[],active,unsub;const fallback=[{id:'test1',title:'Xiaomi 14 Ultra',imageUrl:'images/E3.jpg',description:'Camera-focused flagship phone.',keywords:['phone','camera','android']},{id:'test2',title:'Samsung Fold',imageUrl:'images/E5.jpg',description:'Foldable phone for multitasking.',keywords:['phone','foldable','android']},{id:'test3',title:'Google Pixel',imageUrl:'images/E4.jpg',description:'Clean Android and smart photography.',keywords:['phone','camera','android']}];onAuthStateChanged(auth,async user=>{me=user;profile=user?(await getDoc(doc(db,'users',user.uid))).data():null;loadPosts()});async function loadPosts(){try{const snap=await getDocs(collection(db,'posts'));posts=snap.docs.map(d=>({id:d.id,...d.data()}));if(!posts.length)posts=fallback}catch{posts=fallback}renderFeed()}function rank(list){const seen=JSON.parse(localStorage.getItem('veilside-keywords')||'[]');return [...list].sort(()=>Math.random()-.5).sort((a,b)=>(b.keywords||[]).filter(k=>seen.includes(k)).length-(a.keywords||[]).filter(k=>seen.includes(k)).length)}function cards(list,target){target.innerHTML=list.map(p=>`<button class="card" data-post="${p.id}"><img src="${p.imageUrl}" alt="${esc(p.title)}"><strong>${esc(p.title)}</strong><small>${esc((p.keywords||[]).slice(0,3).join(' · '))}</small></button>`).join('')||'<p class="empty">No posts yet. An administrator can add the first post.</p>'}function renderFeed(){cards(rank(posts),$('#grid'))}function openPost(id){active=posts.find(p=>p.id===id);if(!active)return;const seen=new Set(JSON.parse(localStorage.getItem('veilside-keywords')||'[]'));(active.keywords||[]).forEach(k=>seen.add(k));localStorage.setItem('veilside-keywords',JSON.stringify([...seen]));$('#post').innerHTML=`<img src="${active.imageUrl}" alt="${esc(active.title)}"><div class="info"><h1>${esc(active.title)}</h1><p>${esc(active.description)}</p><p class="keywords">Keywords: ${esc((active.keywords||[]).join(', '))}</p></div>`;cards(rank(posts.filter(p=>p.id!==id)).slice(0,4),$('#similar'));$('#feed').hidden=true;$('#detail').hidden=false;listenComments();scrollTo({top:0,behavior:'smooth'})}function listenComments(){if(unsub)unsub();if(active.id.startsWith('test')){$('#comment-list').innerHTML='<p class="empty">Comments are available for posts added from the admin console.</p>';return}unsub=onSnapshot(query(collection(db,'posts',active.id,'comments'),orderBy('createdAt','asc')),snap=>{$('#comment-list').innerHTML=snap.docs.map(d=>{const c=d.data(),canDelete=me&&(c.authorId===me.uid||profile?.role==='admin');return `<article class="comment"><strong>${esc(c.authorName||'User')}</strong>${canDelete?`<button class="button" data-delete-comment="${d.id}">Delete</button>`:''}<br>${esc(c.text)}<br><small>${c.createdAt?.toDate?c.createdAt.toDate().toLocaleString():'now'}</small></article>`}).join('')||'<p class="empty">No comments yet.</p>'})}document.addEventListener('click',async e=>{const id=e.target.closest('[data-post]')?.dataset.post;if(id)return openPost(id);const commentId=e.target.dataset.deleteComment;if(commentId&&active&&!active.id.startsWith('test'))await deleteDoc(doc(db,'posts',active.id,'comments',commentId))});$('#back').onclick=()=>{if(unsub)unsub();$('#detail').hidden=true;$('#feed').hidden=false};$('#comment-form').onsubmit=async e=>{e.preventDefault();const text=$('#comment').value.trim();if(!text)return;if(!me){location.href='views/login.html';return}if(active.id.startsWith('test'))return;await addDoc(collection(db,'posts',active.id,'comments'),{authorId:me.uid,authorName:profile?.name||profile?.fullName||'User',text,createdAt:serverTimestamp()});$('#comment').value=''};</script></body></html>
