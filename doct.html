<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recommended</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000 url('images/RSP.gif') repeat;color:#fff;font:15px Arial}.app{width:min(96vw,1240px);min-height:100vh;margin:auto;padding:14px;background:rgba(0,0,0,.94);border-left:2px solid #fff;border-right:2px solid #fff}.header{display:flex;align-items:center;padding:5px 9px;border:2px solid #fff}.brand{display:flex;align-items:center;gap:7px;color:#fff;text-decoration:none;font-weight:bold}.brand img{width:47px;height:35px;object-fit:cover}nav{display:flex;margin-left:auto;gap:18px;white-space:nowrap}nav span{display:contents}nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:bold}.title{text-align:center;margin:16px 0 9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:5px;border:2px solid #fff;background:#fff;color:#111;cursor:pointer;text-align:left}.card img{display:block;width:100%;aspect-ratio:1/.78;object-fit:cover}.card strong{display:block;margin-top:5px}.detail[hidden],.feed[hidden]{display:none}.back{margin:12px 0;border:0;background:none;color:#fff;font-weight:bold;cursor:pointer}.post{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.post img,.info{width:100%;min-height:350px;border:2px solid #fff}.post img{object-fit:cover}.info{padding:14px;background:#080808}.rating,.comments{max-width:860px;margin:20px auto;text-align:center}.stars{display:flex;justify-content:center;gap:12px}.star{border:0;background:none;color:#999;font-size:36px;cursor:pointer}.star.selected{color:#fff}.button{padding:6px 16px;border:1px solid #fff;border-radius:14px;background:#777;color:#fff;font-weight:bold;cursor:pointer}.note{min-height:18px;color:#b9e2de;font-size:12px}.comment-form{display:grid;gap:8px}.comment-form textarea{min-height:76px;padding:9px;border:2px solid #fff;border-radius:14px;background:#666;color:#fff;font:inherit}.comment-form .button{justify-self:center}.comment{text-align:left;margin:8px 0;padding:9px;border-left:2px solid #b9e2de;background:#181818}.comment small{color:#bbb}.comment button{float:right}@media(max-width:700px){.app{width:100%;border:0;padding:8px}.post{grid-template-columns:1fr}.post img{height:300px;min-height:0}.grid{gap:7px}.card{padding:3px}nav{gap:8px}nav a{font-size:9px}}
</style></head><body><div class="app"><header class="header"><a class="brand" href="index.html"><img src="images/logo.jpg">VEILSIDE</a><nav><a href="index.html">HOME</a><a href="views/about.html">CHATS</a><span data-account-nav><a href="views/login.html">LOG IN</a></span></nav></header><main><section id="feed" class="feed"><h1 class="title">RECOMMENDED</h1><div id="grid" class="grid"></div></section><section id="detail" class="detail" hidden><button id="back" class="back">← BACK</button><article id="post" class="post"></article><section class="rating"><h2>RATING</h2><div id="stars" class="stars"></div><button id="confirm-rating" class="button">Confirm rating</button><p id="rating-note" class="note"></p></section><section class="comments"><h2>COMMENTS</h2><form id="comment-form" class="comment-form"><textarea id="comment" placeholder="Write a comment…"></textarea><button class="button">Submit</button></form><div id="comments"></div></section></section></main></div><script type="module">import {auth,db,doc,getDoc,setDoc,collection,addDoc,deleteDoc,getDocs,query,orderBy,onSnapshot,serverTimestamp,onAuthStateChanged} from './firebase.js';import {attachAccountNav} from './account-nav.js';attachAccountNav('');const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let me,profile,posts=[],active,rating=0,unsub;onAuthStateChanged(auth,async u=>{me=u;profile=u?(await getDoc(doc(db,'users',u.uid))).data():null;load()});async function load(){try{posts=(await getDocs(collection(db,'posts'))).docs.map(d=>({id:d.id,...d.data()}));$('#grid').innerHTML=posts.map(p=>`<button class="card" data-id="${p.id}"><img src="${p.imageUrl}"><strong>${esc(p.title)}</strong></button>`).join('')||'<p>No posts yet.</p>'}catch{$('#grid').innerHTML='<p>Posts unavailable — check Firestore rules.</p>'}}function show(id){active=posts.find(p=>p.id===id);if(!active)return;$('#post').innerHTML=`<img src="${active.imageUrl}"><div class="info"><h1>${esc(active.title)}</h1><p>${esc(active.description)}</p><p>Keywords: ${esc((active.keywords||[]).join(', '))}</p></div>`;$('#feed').hidden=true;$('#detail').hidden=false;rating=0;renderStars();comments()}function renderStars(){$('#stars').innerHTML=[1,2,3,4,5].map(n=>`<button class="star ${n<=rating?'selected':''}" data-star="${n}">★</button>`).join('')}function comments(){if(unsub)unsub();unsub=onSnapshot(query(collection(db,'posts',active.id,'comments'),orderBy('createdAt','asc')),snap=>{$('#comments').innerHTML=snap.docs.map(d=>{const c=d.data(),del=me&&(c.authorId===me.uid||profile?.role==='admin');return `<article class="comment"><strong>${esc(c.authorName)}</strong>${del?`<button class="button" data-del="${d.id}">Delete</button>`:''}<br>${esc(c.text)}<br><small>${c.createdAt?.toDate?c.createdAt.toDate().toLocaleString():'now'}</small></article>`}).join('')})}document.addEventListener('click',async e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(id)return show(id);if(e.target.dataset.star){rating=Number(e.target.dataset.star);renderStars()}if(e.target.dataset.del)await deleteDoc(doc(db,'posts',active.id,'comments',e.target.dataset.del))});$('#confirm-rating').onclick=async()=>{if(!me){location.href='views/login.html';return}if(!rating)return $('#rating-note').textContent='Choose 1–5 stars first.';try{await setDoc(doc(db,'posts',active.id,'ratings',me.uid),{value:rating,userId:me.uid,updatedAt:serverTimestamp()});$('#rating-note').textContent=`Rating saved: ${rating}/5`}catch(e){$('#rating-note').textContent='Rating was not saved. Add ratings rules.'}};$('#back').onclick=()=>{$('#detail').hidden=true;$('#feed').hidden=false;if(unsub)unsub()};$('#comment-form').onsubmit=async e=>{e.preventDefault();const text=$('#comment').value.trim();if(!text)return;if(!me){location.href='views/login.html';return}try{await addDoc(collection(db,'posts',active.id,'comments'),{authorId:me.uid,authorName:profile?.name||profile?.fullName||'User',text,createdAt:serverTimestamp()});$('#comment').value=''}catch{alert('Comment was not sent. Check Firestore rules.')}}</script></body></html>
