<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartFlea — Chats</title>
    <script>
      try {
        var b =
          localStorage.getItem("smartflea-active-bg") ||
          localStorage.getItem("smartflea-background");
        if (b) {
          document.write(
            '<style id="sf-active-bg-style">body{background-image:url("' +
              b +
              '") !important;background-size:cover !important;background-position:center center !important;background-attachment:fixed !important;background-repeat:no-repeat !important;}</style>',
          );
        }
      } catch (e) {}
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #07080a;
        background-image:
          radial-gradient(
            circle at 50% 0%,
            rgba(78, 205, 196, 0.09) 0%,
            transparent 55%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(31, 80, 73, 0.12) 0%,
            transparent 50%
          ),
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
          );
        background-size:
          100% 100%,
          100% 100%,
          36px 36px,
          36px 36px;
        background-attachment: fixed;
        color: #fff;
        font:
          clamp(13px, 1.1vw, 15px) Arial,
          sans-serif;
      }
      .app {
        width: min(96vw, 1240px);
        min-height: 100vh;
        margin: auto;
        padding: 16px;
        background: rgba(10, 10, 12, 0.95);
        border-left: 2px solid rgba(255, 255, 255, 0.85);
        border-right: 2px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px 12px;
        border: 2px solid #fff;
        border-radius: 8px;
        background: rgba(20, 20, 24, 0.7);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        letter-spacing: 0.5px;
      }
      .brand img {
        width: 120px;
        height: 40px;
        object-fit: cover;
        border-radius: 4px;
      }
      nav {
        display: flex;
        gap: clamp(10px, 1.6vw, 24px);
        margin-left: auto;
        align-items: center;
        white-space: nowrap;
      }
      nav span {
        display: contents;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        font-size: clamp(11px, 0.95vw, 13px);
        font-weight: bold;
        letter-spacing: 0.5px;
        transition:
          color 0.15s ease,
          text-shadow 0.15s ease;
      }
      nav a:hover,
      nav a.active {
        color: #4ecdc4;
        text-shadow: 0 0 8px rgba(78, 205, 196, 0.4);
      }
      [hidden],
      .box[hidden],
      .modal[hidden] {
        display: none !important;
      }
      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 16px;
        margin-top: 16px;
        height: 652px;
        align-items: stretch;
      }
      #chat-sidebar {
        grid-column: 1;
        grid-row: 1;
      }
      #empty,
      #chat {
        grid-column: 2;
        grid-row: 1;
      }
      .box {
        border: 2px solid #fff;
        border-radius: 8px;
        background: #101014;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 2px solid #fff;
        background: rgba(24, 24, 28, 0.9);
        font-size: 15px;
      }
      .chat-header-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 14px;
        border-bottom: 2px solid #fff;
        background: rgba(24, 24, 28, 0.9);
      }
      .back-to-list {
        display: none;
        padding: 4px 10px;
        font-size: 12px;
        background: #333;
        border: 1px solid #777;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
      }
      .chat-title-btn {
        flex: 1;
        background: transparent;
        border: 0;
        color: #fff;
        font-weight: bold;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
        padding: 0;
      }
      .list {
        padding: 10px;
        height: 600px;
        overflow-y: auto;
      }
      .list::-webkit-scrollbar {
        width: 6px;
      }
      .list::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 4px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 8px;
        background: #18191c;
        color: #fff;
        border: 1px solid #333;
        border-radius: 8px;
        text-align: left;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.1s ease;
      }
      .item:hover {
        background: #25282e;
        border-color: #4ecdc4;
        transform: translateY(-1px);
      }
      .item.active-chat {
        border-color: #4ecdc4;
        background: #1b3330;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #444;
        border: 1px solid #666;
        color: #fff;
        font-weight: bold;
        flex-shrink: 0;
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .item-details {
        flex: 1;
        min-width: 0;
      }
      .unread-badge {
        display: grid;
        place-items: center;
        min-width: 21px;
        height: 21px;
        padding: 0 6px;
        border-radius: 999px;
        background: #e54b4b;
        color: #fff;
        font-size: 11px;
        font-weight: bold;
      }
      .item-details strong {
        display: block;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item small {
        display: block;
        color: #aaa;
        font-size: 11px;
        margin-top: 3px;
      }
      .empty {
        display: grid;
        place-items: center;
        /* Let the empty chat panel stretch to the sidebar's full height.
           The sidebar has a 600px list plus its header. */
        min-height: 600px;
        height: auto;
        align-self: stretch;
        color: #888;
        font-size: 16px;
      }
      .messages {
        flex: 1;
        min-height: 0;
        height: auto;
        padding: 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .messages::-webkit-scrollbar {
        width: 6px;
      }
      .messages::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 4px;
      }
      .msg-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin: 5px 0;
        max-width: 80%;
      }
      .msg-row.mine {
        margin-left: auto;
        justify-content: flex-end;
      }
      .msg-avatar {
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        margin-bottom: 2px;
        display: grid;
        place-items: center;
        background: #333;
        color: #fff;
        font-weight: bold;
        font-size: 13px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .msg-avatar:hover {
        transform: scale(1.12);
      }
      .msg-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .msg-avatar .avatar-letter {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: bold;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .msg-author {
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 4px;
        cursor: default;
        letter-spacing: 0.3px;
      }
      .msg-text {
        word-break: break-word;
      }
      .msg {
        max-width: 100%;
        padding: 9px 13px;
        border-radius: 12px;
        background: #282a30;
        line-height: 1.45;
        font-size: 14px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        word-break: break-word;
      }
      .msg-row.mine .msg,
      .msg.mine {
        background: #1f5049;
        border-bottom-right-radius: 3px;
        color: #fff;
      }
      .msg-row:not(.mine) .msg,
      .msg:not(.mine) {
        border-bottom-left-radius: 3px;
      }
      .time {
        display: block;
        font-size: 10px;
        color: #bbb;
        text-align: right;
        margin-top: 4px;
      }
      .compose {
        display: flex;
        gap: 10px;
        padding: 10px 14px;
        border-top: 2px solid #fff;
        background: rgba(24, 24, 28, 0.9);
        align-items: center;
      }
      .attach-btn {
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: transparent;
        border: none;
        color: #8e959e;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          color 0.18s ease,
          background 0.18s ease,
          transform 0.18s ease;
      }
      .attach-btn:hover {
        color: #4ecdc4;
        background: rgba(78, 205, 196, 0.14);
        transform: rotate(-12deg) scale(1.08);
      }
      .attach-btn svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2.1;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: block;
      }
      .attachment-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: rgba(22, 38, 35, 0.95);
        border-top: 2px solid #4ecdc4;
        gap: 10px;
        animation: slideUp 0.15s ease-out;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .attachment-preview {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }
      .attachment-thumb {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        object-fit: cover;
        border: 1px solid #4ecdc4;
        flex-shrink: 0;
        background: #000;
      }
      .attachment-icon {
        font-size: 22px;
        flex-shrink: 0;
      }
      .attachment-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }
      .attachment-name {
        font-size: 13px;
        font-weight: bold;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .attachment-size {
        font-size: 11px;
        color: #4ecdc4;
      }
      .attachment-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .attachment-send-now {
        padding: 5px 12px;
        font-size: 12px;
        border-radius: 12px;
        background: #1f5049;
        border: 1px solid #4ecdc4;
        color: #fff;
        cursor: pointer;
        font-weight: bold;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }
      .attachment-send-now:hover {
        background: #286d63;
        transform: translateY(-1px);
      }
      .cancel-attachment-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid #777;
        background: rgba(0, 0, 0, 0.5);
        color: #ff9d9d;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
        transition: all 0.15s ease;
      }
      .cancel-attachment-btn:hover {
        background: #ff6b6b;
        color: #fff;
        border-color: #ff6b6b;
      }
      .message-file {
        display: block;
        max-width: min(340px, 100%);
        margin-top: 6px;
      }
      .message-file img {
        display: block;
        max-width: 100%;
        max-height: 260px;
        margin-top: 5px;
        border-radius: 8px;
        background: #000;
        object-fit: contain;
        cursor: pointer;
      }
      .file-download-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        margin-top: 4px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #c9fffb;
        text-decoration: none;
        font-size: 13px;
        transition: all 0.15s ease;
      }
      .file-download-chip:hover {
        background: rgba(78, 205, 196, 0.25);
        border-color: #4ecdc4;
        color: #fff;
      }
      .chip-icon {
        font-size: 18px;
      }
      .chip-name {
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: bold;
      }
      .chip-action {
        font-size: 11px;
        color: #4ecdc4;
        margin-left: 4px;
      }
      .compose input {
        flex: 1;
        padding: 10px 14px;
        background: #25282e;
        color: #fff;
        border: 1px solid #555;
        border-radius: 14px;
        font: inherit;
        transition: border-color 0.15s ease;
      }
      .compose input:focus {
        border-color: #4ecdc4;
        outline: none;
      }
      .btn {
        padding: 7px 16px;
        border: 1px solid #fff;
        border-radius: 14px;
        background: #777;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }
      .btn:hover {
        background: #999;
        transform: translateY(-1px);
      }
      .danger {
        background: #dc3545;
        border-color: #dc3545;
      }
      .danger:hover {
        background: #bd2130;
      }
      .modal[hidden] {
        display: none;
      }
      .modal {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.82);
        z-index: 100;
        padding: 14px;
      }
      .panel {
        width: min(94vw, 440px);
        max-height: 85vh;
        overflow-y: auto;
        padding: 20px;
        border: 2px solid #fff;
        border-radius: 12px;
        background: #141418;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      }
      .panel h3,
      .panel b {
        font-size: 18px;
        margin: 0 0 12px;
        display: block;
      }
      .group-name-input {
        width: 100%;
        padding: 10px 14px;
        margin: 8px 0 14px;
        background: #25282e;
        color: #fff;
        border: 1px solid #555;
        border-radius: 8px;
        font: inherit;
      }
      .group-name-input:focus {
        border-color: #4ecdc4;
        outline: none;
      }
      .members-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: #ccc;
        margin-bottom: 8px;
      }
      .counter-badge {
        color: #4ecdc4;
        font-weight: bold;
      }
      .search-box {
        width: 100%;
        padding: 8px 12px;
        margin-bottom: 10px;
        background: #202228;
        border: 1px solid #555;
        border-radius: 8px;
        color: #fff;
        font-size: 13px;
      }
      .search-box:focus {
        border-color: #4ecdc4;
        outline: none;
      }
      .picker-list {
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid #444;
        border-radius: 8px;
        background: #18191c;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .picker-list::-webkit-scrollbar {
        width: 6px;
      }
      .picker-list::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 4px;
      }
      .picker-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #22242a;
        border: 1px solid #333;
        cursor: pointer;
        user-select: none;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .picker-item:hover {
        background: #2c2f38;
        border-color: #666;
      }
      .picker-item.selected {
        background: #1b3834;
        border-color: #4ecdc4;
      }
      .picker-checkbox {
        display: none;
      }
      .picker-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #444;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: bold;
        font-size: 13px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .picker-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .picker-info {
        flex: 1;
        min-width: 0;
      }
      .picker-name {
        font-weight: bold;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .picker-status {
        font-size: 11px;
        color: #aaa;
      }
      .picker-badge {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #666;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: bold;
        flex-shrink: 0;
        color: transparent;
      }
      .picker-item.selected .picker-badge {
        background: #4ecdc4;
        border-color: #4ecdc4;
        color: #111;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
      }
      .member {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #333;
      }
      .error-msg {
        color: #ff6b6b;
        font-size: 13px;
        margin-top: 8px;
      }

      /* Responsive Mobile Styles */
      @media (max-width: 768px) {
        .app {
          width: 100%;
          border: 0;
          padding: 8px;
          min-height: 100vh;
          min-height: 100dvh;
          display: flex;
          flex-direction: column;
        }
        .header {
          flex-wrap: wrap;
          gap: 8px;
          flex-shrink: 0;
        }
        nav {
          gap: 10px;
        }
        nav a {
          font-size: 11px;
        }
        .layout {
          display: flex;
          flex-direction: column;
          flex: 1;
          margin-top: 8px;
          height: auto;
        }
        #chat-sidebar,
        #empty,
        #chat {
          grid-column: 1;
          grid-row: auto;
        }
        /* Mobile Messenger View: fixed full-screen chat like Telegram */
        .layout.chat-active #chat-sidebar {
          display: none !important;
        }
        .layout:not(.chat-active) #chat {
          display: none !important;
        }
        .layout.chat-active #chat {
          display: flex !important;
          flex-direction: column;
          flex: 1;
          height: calc(100vh - 80px);
          height: calc(100dvh - 80px);
          min-height: 380px;
        }
        .layout:not(.chat-active) #chat-sidebar {
          display: flex !important;
          flex-direction: column;
          flex: 1;
          height: calc(100vh - 80px);
          height: calc(100dvh - 80px);
          min-height: 380px;
        }
        .chat-header-bar,
        .head {
          flex-shrink: 0;
        }
        .compose {
          flex-shrink: 0;
        }
        .list,
        .messages {
          flex: 1;
          min-height: 0;
          height: auto;
          max-height: none;
          overflow-y: auto;
        }
        .back-to-list {
          display: inline-block;
        }
        .empty {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <a class="brand" href="../index.html"
          ><img src="../images/logo.jpg" alt="SmartFlea"
        /></a>
        <nav>
          <a href="../index.html">HOME</a>
          <a href="../doct.html">RECOMMENDED</a>
          <a href="about.html" class="active">CHATS</a>
          <span data-account-nav><a href="profile.html">PROFILE</a></span>
        </nav>
      </header>

      <main id="chat-layout" class="layout">
        <!-- Sidebar: Chat List -->
        <aside id="chat-sidebar" class="box">
          <div class="head">
            <b>CHATS</b>
            <button id="new" class="btn" type="button">+ GROUP</button>
          </div>
          <div id="list" class="list"></div>
        </aside>

        <!-- Empty state placeholder on desktop -->
        <section id="empty" class="box empty">
          <div>💬 Choose a chat or user to start messaging</div>
        </section>

        <!-- Active Conversation View -->
        <section id="chat" class="box" hidden>
          <div class="chat-header-bar">
            <button id="back-to-list" class="back-to-list" type="button">
              ← Back
            </button>
            <button
              id="chat-title"
              class="chat-title-btn"
              type="button"
            ></button>
          </div>
          <div id="messages" class="messages"></div>
          <div id="attachment-bar" class="attachment-bar" hidden>
            <div class="attachment-preview">
              <span id="attachment-icon" class="attachment-icon">📎</span>
              <img
                id="attachment-thumb"
                class="attachment-thumb"
                hidden
                alt="Preview"
              />
              <div class="attachment-info">
                <span id="attachment-name" class="attachment-name"></span>
                <span id="attachment-size" class="attachment-size"></span>
              </div>
            </div>
            <div class="attachment-actions">
              <button
                id="send-attachment-now"
                class="attachment-send-now"
                type="button"
                title="Send now"
              >
                Send now 🚀
              </button>
              <button
                id="cancel-attachment"
                class="cancel-attachment-btn"
                type="button"
                title="Remove attachment"
              >
                ✕
              </button>
            </div>
          </div>
          <form id="form" class="compose">
            <input
              id="file-input"
              type="file"
              hidden
              accept="image/*,.pdf,.doc,.docx,.txt,.zip"
            />
            <button
              id="attach-btn"
              class="attach-btn"
              type="button"
              title="Attach photo or document"
              aria-label="Attach file"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"
                ></path>
              </svg>
            </button>
            <input id="text" placeholder="Type a message…" autocomplete="off" />
            <button class="btn" type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>

    <!-- Create Group Modal with custom scroller and member picker -->
    <div id="create-modal" class="modal" hidden>
      <div class="panel">
        <h3>Create new group</h3>
        <input id="name" class="group-name-input" placeholder="Group name" />
        <div class="members-header">
          <span>Choose participants:</span>
          <span id="selected-count" class="counter-badge">0 selected</span>
        </div>
        <input
          id="search-members"
          class="search-box"
          placeholder="Filter people by name…"
        />
        <div id="checks" class="picker-list"></div>
        <p id="error" class="error-msg"></p>
        <div class="modal-footer">
          <button id="cancel" class="btn" type="button">Cancel</button>
          <button
            id="create"
            class="btn"
            type="button"
            style="background: #1f5049; border-color: #4ecdc4"
          >
            Create
          </button>
        </div>
      </div>
    </div>

    <!-- Group Members Modal -->
    <div id="members-modal" class="modal" hidden>
      <div class="panel">
        <h3 id="members-title"></h3>
        <div id="members" style="max-height: 250px; overflow-y: auto"></div>
        <div class="modal-footer">
          <button id="delete-group" class="btn danger" type="button" hidden>
            Delete group
          </button>
          <button id="close-members" class="btn" type="button">Close</button>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        auth,
        db,
        doc,
        setDoc,
        updateDoc,
        deleteDoc,
        serverTimestamp,
        onAuthStateChanged,
        collection,
        addDoc,
        getDocs,
        query,
        where,
        orderBy,
        onSnapshot,
      } from "../firebase.js";
      import { attachAccountNav } from "../account-nav.js";

      attachAccountNav("../");

      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s || "").replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );

      let me;
      let users = [];
      let groups = [];
      let active;
      let stop;
      let stagedAttachment = null;
      let knownChatIds = new Set();
      const unreadCounts = new Map();
      const unreadStops = new Map();
      const allUsersMap = new Map();

      const TG_COLORS = [
        "#4ecdc4",
        "#ff7675",
        "#fdcb6e",
        "#a29bfe",
        "#74b9ff",
        "#55efc4",
        "#fab1a0",
        "#e17055",
        "#00cec9",
        "#fd79a8",
        "#0984e3",
      ];

      function getAuthorColor(uid) {
        let hash = 0;
        const str = uid || "";
        for (let i = 0; i < str.length; i++) {
          hash = (hash * 31 + str.charCodeAt(i)) & 0xffffffff;
        }
        return TG_COLORS[Math.abs(hash) % TG_COLORS.length];
      }

      function getUserInfo(senderId) {
        if (!senderId) return { name: "User", avatarUrl: "" };
        if (senderId === me.uid) {
          return {
            name: me.displayName || "You",
            avatarUrl: me.photoURL || allUsersMap.get(me.uid)?.avatarUrl || "",
          };
        }
        const user = allUsersMap.get(senderId);
        if (user) {
          return {
            name: user.name || user.fullName || "User",
            avatarUrl: user.avatarUrl || "",
          };
        }
        return {
          name: "User",
          avatarUrl: "",
        };
      }

      function formatMsgTime(timestamp) {
        if (!timestamp?.toDate) return "…";
        const d = timestamp.toDate();
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const time = d.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        return isToday
          ? time
          : `${d.toLocaleDateString([], { month: "short", day: "numeric" })}, ${time}`;
      }

      function formatSize(bytes) {
        if (!bytes) return "";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
      }

      function compressChatPhoto(
        file,
        maxWidth = 1200,
        maxHeight = 1200,
        quality = 0.78,
      ) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = reject;
          reader.onload = (e) => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
              let w = img.width;
              let h = img.height;
              if (w > maxWidth || h > maxHeight) {
                const ratio = Math.min(maxWidth / w, maxHeight / h);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
              }
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.imageSmoothingQuality = "high";
              ctx.drawImage(img, 0, 0, w, h);
              let q = quality;
              let dataUrl = canvas.toDataURL("image/jpeg", q);
              // Ensure photo payload is well within Firestore's 1MB document limit
              while (dataUrl.length > 600 * 1024 && q > 0.4) {
                q -= 0.12;
                dataUrl = canvas.toDataURL("image/jpeg", q);
              }
              resolve({
                dataUrl,
                fileName: file.name,
                fileType: "image/jpeg",
                sizeBytes: Math.round((dataUrl.length * 3) / 4),
              });
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function readDocumentFile(file) {
        return new Promise((resolve, reject) => {
          if (file.type.startsWith("video/")) {
            return reject(
              new Error(
                "⚠️ Відео не підтримується у безкоштовному тарифі через великий розмір.\nВи можете надсилати фотографії будь-якого розміру (вони стискаються автоматично) та документи до 600 КБ.",
              ),
            );
          }
          if (file.size > 600 * 1024) {
            return reject(
              new Error(
                `⚠️ Файл завеликий: ${(file.size / (1024 * 1024)).toFixed(2)} МБ.\n\nЛіміт для документів у безкоштовному чаті — 600 КБ.\nФотографії та картинки будь-якого розміру оптимізуються автоматично!`,
              ),
            );
          }
          const reader = new FileReader();
          reader.onerror = reject;
          reader.onload = () => {
            resolve({
              dataUrl: reader.result,
              fileName: file.name,
              fileType: file.type || "application/octet-stream",
              sizeBytes: file.size,
            });
          };
          reader.readAsDataURL(file);
        });
      }

      function clearAttachment() {
        stagedAttachment = null;
        const fi = $("#file-input");
        if (fi) fi.value = "";
        const ab = $("#attachment-bar");
        if (ab) ab.hidden = true;
      }

      const direct = (x) => [me.uid, x].sort().join("_");

      onAuthStateChanged(auth, async (u) => {
        if (!u) return (location.href = "login.html");
        me = u;
        await load();

        // Check if opened with ?user=...
        const targetUserId = new URLSearchParams(window.location.search).get(
          "user",
        );
        if (targetUserId) {
          const targetUser = users.find((x) => x.id === targetUserId);
          if (targetUser) openChat(targetUser);
        }
      });

      async function load() {
        const u = await getDocs(collection(db, "users"));
        allUsersMap.clear();
        u.docs.forEach((d) => {
          allUsersMap.set(d.id, { id: d.id, ...d.data() });
        });
        users = u.docs
          .filter((x) => x.id !== me.uid)
          .map((x) => ({ id: x.id, ...x.data() }));

        try {
          const g = await getDocs(
            query(
              collection(db, "chats"),
              where("members", "array-contains", me.uid),
            ),
          );
          knownChatIds = new Set(g.docs.map((chat) => chat.id));
          groups = g.docs
            .filter((x) => x.data().type === "group")
            .map((x) => ({ id: x.id, ...x.data() }));
        } catch {
          groups = [];
          knownChatIds = new Set();
        }
        render();
        syncUnreadListeners();
      }

      function render() {
        $("#list").innerHTML =
          groups
            .map(
              (g) => `
              <button class="item ${active?.id === g.id ? "active-chat" : ""}" data-g="${g.id}" type="button">
                <span class="avatar" style="background:#203b37;color:#4ecdc4;">#</span>
                <div class="item-details">
                  <strong>${esc(g.name)}</strong>
                  <small>${g.members.length} members</small>
                </div>
                ${unreadBadge(g.id)}
              </button>
            `,
            )
            .join("") +
          users
            .map((u) => {
              const name = esc(u.name || u.fullName || "User");
              const letter = (u.name || u.fullName || "?")[0].toUpperCase();
              return `
              <button class="item ${active?.id === u.id ? "active-chat" : ""}" data-u="${u.id}" type="button">
                <span class="avatar">${u.avatarUrl ? `<img src="${u.avatarUrl}" alt="${name}">` : letter}</span>
                <div class="item-details">
                  <strong>${name}</strong>
                  <small>${u.online ? "🟢 online" : "⚪ offline"}</small>
                </div>
                ${unreadBadge(direct(u.id))}
              </button>
            `;
            })
            .join("");

        renderPicker(users);
      }

      function unreadBadge(chatId) {
        const count = unreadCounts.get(chatId) || 0;
        return count
          ? `<span class="unread-badge" aria-label="${count} unread messages">${count > 99 ? "99+" : count}</span>`
          : "";
      }

      function readKey(chatId) {
        return `smartflea-last-read-${me.uid}-${chatId}`;
      }

      function markRead(chatId) {
        localStorage.setItem(readKey(chatId), String(Date.now()));
        unreadCounts.set(chatId, 0);
        render();
      }

      function syncUnreadListeners() {
        const chatIds = new Set([
          ...groups.map((group) => group.id),
          ...knownChatIds,
        ]);
        unreadStops.forEach((stopListening, chatId) => {
          if (!chatIds.has(chatId)) {
            stopListening();
            unreadStops.delete(chatId);
          }
        });
        chatIds.forEach((chatId) => {
          if (unreadStops.has(chatId)) return;
          unreadStops.set(
            chatId,
            onSnapshot(collection(db, "chats", chatId, "messages"), (snap) => {
              const lastRead = Number(
                localStorage.getItem(readKey(chatId)) || 0,
              );
              const count = snap.docs.filter((document) => {
                const message = document.data();
                const sentAt = message.createdAt?.toMillis
                  ? message.createdAt.toMillis()
                  : 0;
                return message.senderId !== me.uid && sentAt > lastRead;
              }).length;
              if ((unreadCounts.get(chatId) || 0) !== count) {
                unreadCounts.set(chatId, count);
                render();
              }
            }),
          );
        });
      }

      function renderPicker(list) {
        $("#checks").innerHTML = list.length
          ? list
              .map((u) => {
                const name = esc(u.name || u.fullName || "User");
                const username = esc(u.username || "user");
                const letter = (u.name || u.fullName || "?")[0].toUpperCase();
                return `
              <label class="picker-item" data-uid="${u.id}">
                <input type="checkbox" value="${u.id}" class="picker-checkbox">
                <div class="picker-avatar">${u.avatarUrl ? `<img src="${u.avatarUrl}">` : letter}</div>
                <div class="picker-info">
                  <div class="picker-name">${name}</div>
                  <small class="picker-status">@${username} · ${u.online ? "online" : "offline"}</small>
                </div>
                <div class="picker-badge">✓</div>
              </label>
            `;
              })
              .join("")
          : "<p style='color:#bbb;padding:10px;text-align:center;'>No matching users found.</p>";

        updateSelectedCount();
      }

      function updateSelectedCount() {
        const count = document.querySelectorAll("#checks input:checked").length;
        $("#selected-count").textContent = `${count} selected`;
      }

      // Member picker checkbox toggle
      $("#checks").addEventListener("change", (e) => {
        const item = e.target.closest(".picker-item");
        if (item) {
          if (e.target.checked) {
            item.classList.add("selected");
          } else {
            item.classList.remove("selected");
          }
          updateSelectedCount();
        }
      });

      // Filter members search input
      $("#search-members").oninput = (e) => {
        const query = e.target.value.trim().toLowerCase();
        const filtered = users.filter((u) => {
          const name = (u.name || u.fullName || "").toLowerCase();
          const uname = (u.username || "").toLowerCase();
          return name.includes(query) || uname.includes(query);
        });
        renderPicker(filtered);
      };

      async function openChat(x) {
        active = x;
        const id = x.type === "group" ? x.id : direct(x.id);
        if (x.type !== "group") {
          try {
            await setDoc(
              doc(db, "chats", id),
              {
                type: "direct",
                members: [me.uid, x.id].sort(),
                updatedAt: serverTimestamp(),
              },
              { merge: true },
            );
            knownChatIds.add(id);
            syncUnreadListeners();
          } catch (error) {
            console.error("Could not open direct chat:", error);
            alert(
              `Could not open this private chat: ${error.code || error.message}`,
            );
            active = null;
            return;
          }
        }

        $("#chat-layout").classList.add("chat-active");
        $("#empty").hidden = true;
        $("#chat").hidden = false;
        $("#chat-title").textContent = x.name || x.fullName;
        clearAttachment();

        // Highlight active item in list
        document.querySelectorAll(".item").forEach((el) => {
          el.classList.remove("active-chat");
        });
        const activeItem = document.querySelector(
          `[data-u="${x.id}"], [data-g="${x.id}"]`,
        );
        if (activeItem) activeItem.classList.add("active-chat");

        if (stop) stop();
        markRead(id);
        stop = onSnapshot(
          query(
            collection(db, "chats", id, "messages"),
            orderBy("createdAt", "asc"),
          ),
          (s) => {
            const isGroup = active && active.type === "group";
            $("#messages").innerHTML = s.docs.length
              ? s.docs
                  .map((d) => {
                    const m = d.data();
                    const isMine = m.senderId === me.uid;
                    const sender = getUserInfo(m.senderId);
                    const senderName = sender.name;
                    const senderAvatar = sender.avatarUrl;
                    const senderLetter = (senderName || "?")[0].toUpperCase();

                    const attachment = m.fileUrl
                      ? `<div class="message-file">${
                          m.fileType?.startsWith("image/")
                            ? `<a href="${m.fileUrl}" target="_blank" rel="noopener"><img src="${m.fileUrl}" alt="${esc(m.fileName || "Photo")}"></a>`
                            : `<a class="file-download-chip" href="${m.fileUrl}" download="${esc(m.fileName || "file")}"><span class="chip-icon">📄</span> <span class="chip-name">${esc(m.fileName || "Attachment")}</span> <span class="chip-action">⬇ Завантажити</span></a>`
                        }</div>`
                      : "";

                    const timeStr = formatMsgTime(m.createdAt);

                    return `
                      <div class="msg-row ${isMine ? "mine" : ""} ${isGroup && !isMine ? "has-avatar" : ""}">
                        ${
                          isGroup && !isMine
                            ? `<button class="msg-avatar" type="button" title="${esc(senderName)}" data-sender-uid="${m.senderId}">
                                ${
                                  senderAvatar
                                    ? `<img src="${senderAvatar}" alt="${esc(senderName)}">`
                                    : `<span class="avatar-letter" style="background:${getAuthorColor(m.senderId)}">${senderLetter}</span>`
                                }
                              </button>`
                            : ""
                        }
                        <div class="msg ${isMine ? "mine" : ""}">
                          ${
                            isGroup && !isMine
                              ? `<div class="msg-author" style="color:${getAuthorColor(m.senderId)}">${esc(senderName)}</div>`
                              : ""
                          }
                          ${m.text ? `<div class="msg-text">${esc(m.text)}</div>` : ""}
                          ${attachment}
                          <small class="time">${timeStr}</small>
                        </div>
                      </div>
                    `;
                  })
                  .join("")
              : '<div style="margin: auto; color: #888; font-size: 13px; text-align: center; padding: 20px;">💬 No messages yet.<br>Send a message to start chatting!</div>';
            $("#messages").scrollTop = $("#messages").scrollHeight;
          },
          (error) => {
            console.error("Could not load messages:", error);
            $("#messages").innerHTML =
              `<div style="margin:auto;color:#ff9d9d;text-align:center;padding:20px;">Could not load messages: ${esc(error.code || "permission denied")}</div>`;
          },
        );
      }

      // Back to chat list button on mobile
      $("#back-to-list").onclick = () => {
        $("#chat-layout").classList.remove("chat-active");
        $("#chat").hidden = true;
        $("#empty").hidden = false;
        active = null;
        clearAttachment();
        document
          .querySelectorAll(".item")
          .forEach((el) => el.classList.remove("active-chat"));
        if (stop) {
          stop();
          stop = null;
        }
      };

      document.addEventListener("click", (e) => {
        const senderUid =
          e.target.closest("[data-sender-uid]")?.dataset.senderUid;
        if (senderUid) {
          const target = users.find((x) => x.id === senderUid);
          if (target) openChat(target);
          return;
        }
        const u = e.target.closest("[data-u]")?.dataset.u;
        const g = e.target.closest("[data-g]")?.dataset.g;
        if (u) openChat(users.find((x) => x.id === u));
        if (g) openChat(groups.find((x) => x.id === g));
      });

      $("#new").onclick = () => {
        $("#name").value = "";
        $("#search-members").value = "";
        $("#error").textContent = "";
        renderPicker(users);
        $("#create-modal").hidden = false;
      };

      $("#cancel").onclick = () => ($("#create-modal").hidden = true);

      $("#create").onclick = async () => {
        const name = $("#name").value.trim();
        const members = [
          ...document.querySelectorAll("#checks input:checked"),
        ].map((x) => x.value);

        if (!name || !members.length) {
          $("#error").textContent =
            "Please enter group name and choose at least one participant.";
          return;
        }

        try {
          const id = "group_" + Date.now();
          await setDoc(doc(db, "chats", id), {
            type: "group",
            name,
            ownerId: me.uid,
            members: [me.uid, ...members],
            createdAt: serverTimestamp(),
          });
          $("#create-modal").hidden = true;
          await load();
          openChat(groups.find((x) => x.id === id));
        } catch (e) {
          $("#error").textContent = e.message || e.code;
        }
      };

      $("#chat-title").onclick = () => {
        if (!active || active.type !== "group") return;
        $("#members-title").textContent = active.name;
        const owner = active.ownerId === me.uid;
        $("#members").innerHTML = active.members
          .map((id) => {
            const u = users.find((x) => x.id === id);
            return `<div class="member"><span>${esc(u?.name || u?.fullName || "You")}</span>${owner && id !== me.uid ? `<button class="btn danger" data-remove="${id}" type="button">Remove</button>` : ""}</div>`;
          })
          .join("");
        $("#delete-group").hidden = !owner;
        $("#members-modal").hidden = false;
      };

      $("#members").onclick = async (e) => {
        const id = e.target.dataset.remove;
        if (id) {
          await updateDoc(doc(db, "chats", active.id), {
            members: active.members.filter((x) => x !== id),
          });
          await load();
          active = groups.find((x) => x.id === active.id);
          $("#members-modal").hidden = true;
        }
      };

      $("#delete-group").onclick = async () => {
        if (confirm("Delete this group?")) {
          await deleteDoc(doc(db, "chats", active.id));
          $("#members-modal").hidden = true;
          $("#chat").hidden = true;
          $("#chat-layout").classList.remove("chat-active");
          $("#empty").hidden = false;
          await load();
        }
      };

      $("#close-members").onclick = () => ($("#members-modal").hidden = true);

      $("#attach-btn").onclick = () => $("#file-input").click();

      $("#file-input").onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          if (file.type.startsWith("image/")) {
            stagedAttachment = await compressChatPhoto(file);
            $("#attachment-thumb").src = stagedAttachment.dataUrl;
            $("#attachment-thumb").hidden = false;
            $("#attachment-icon").hidden = true;
          } else {
            stagedAttachment = await readDocumentFile(file);
            $("#attachment-thumb").hidden = true;
            $("#attachment-icon").hidden = false;
            $("#attachment-icon").textContent = "📄";
          }
          $("#attachment-name").textContent = stagedAttachment.fileName;
          $("#attachment-size").textContent = formatSize(
            stagedAttachment.sizeBytes,
          );
          $("#attachment-bar").hidden = false;
          $("#text").focus();
        } catch (err) {
          alert(err.message || "Could not process file.");
          clearAttachment();
        }
      };

      $("#cancel-attachment").onclick = clearAttachment;

      $("#send-attachment-now").onclick = () => {
        if ($("#form").requestSubmit) {
          $("#form").requestSubmit();
        } else {
          $("#form").dispatchEvent(new Event("submit", { cancelable: true }));
        }
      };

      $("#form").onsubmit = async (e) => {
        e.preventDefault();
        const text = $("#text").value.trim();
        if ((!text && !stagedAttachment) || !active) return;
        const id = active.type === "group" ? active.id : direct(active.id);
        const toSend = stagedAttachment;
        try {
          await addDoc(collection(db, "chats", id, "messages"), {
            senderId: me.uid,
            text,
            fileUrl: toSend ? toSend.dataUrl : "",
            fileName: toSend ? toSend.fileName : "",
            fileType: toSend ? toSend.fileType : "",
            createdAt: serverTimestamp(),
          });
          const lastMsg =
            text || (toSend ? `📎 ${toSend.fileName}` : "Attachment");
          await setDoc(
            doc(db, "chats", id),
            { updatedAt: serverTimestamp(), lastMessage: lastMsg },
            { merge: true },
          );
          $("#text").value = "";
          clearAttachment();
        } catch (error) {
          console.error("Could not send message:", error);
          alert(`Message was not sent: ${error.code || error.message}`);
        }
      };
    </script>
  </body>
</html>
