<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartFlea — Profile</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #07080a;
        background-image:
          radial-gradient(circle at 50% 0%, rgba(78, 205, 196, 0.09) 0%, transparent 55%),
          radial-gradient(circle at 100% 100%, rgba(31, 80, 73, 0.12) 0%, transparent 50%),
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
        background-attachment: fixed;
        color: #fff;
        font: clamp(13px, 1.1vw, 15px) Arial, sans-serif;
      }
      .app {
        width: min(96vw, 1240px);
        min-height: 100vh;
        margin: auto;
        padding: 16px;
        background: rgba(10, 10, 12, 0.95);
        border-left: 2px solid rgba(255, 255, 255, 0.85);
        border-right: 2px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px 12px;
        border: 2px solid #fff;
        border-radius: 8px;
        background: rgba(20, 20, 24, 0.7);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        letter-spacing: 0.5px;
      }
      .brand img {
        width: 120px;
        height: 40px;
        object-fit: cover;
        border-radius: 4px;
      }
      nav {
        display: flex;
        gap: clamp(10px, 1.6vw, 24px);
        margin-left: auto;
        align-items: center;
        white-space: nowrap;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        font-size: clamp(11px, 0.95vw, 13px);
        font-weight: bold;
        letter-spacing: 0.5px;
        transition: color 0.15s ease, text-shadow 0.15s ease;
      }
      nav a:hover,
      nav a.active {
        color: #4ecdc4;
        text-shadow: 0 0 8px rgba(78, 205, 196, 0.4);
      }
      .title {
        text-align: center;
        margin: 20px 0 16px;
        font-size: clamp(17px, 1.6vw, 22px);
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .profile-layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 20px;
        margin-top: 14px;
      }
      .panel {
        padding: 20px;
        border: 2px solid #fff;
        border-radius: 10px;
        background: #121316;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      .panel h2 {
        margin: 0 0 16px;
        font-size: 18px;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
      }
      .user-summary {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .avatar-wrapper {
        position: relative;
        margin-bottom: 14px;
        cursor: pointer;
        display: inline-block;
        border-radius: 50%;
        user-select: none;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        overflow: hidden;
        background: #25282e;
        border: 3px solid #4ecdc4;
        color: #fff;
        font-size: 42px;
        font-weight: bold;
        box-shadow: 0 0 18px rgba(78, 205, 196, 0.35);
        transition: transform 0.2s ease, border-color 0.2s ease;
      }
      .avatar-wrapper:hover .avatar {
        border-color: #fff;
        transform: scale(1.02);
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar-overlay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.58);
        backdrop-filter: blur(2px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      .avatar-wrapper:hover .avatar-overlay {
        opacity: 1;
      }
      .avatar-pencil-center {
        font-size: 24px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
      }
      .avatar-overlay-text {
        font-size: 11px;
        font-weight: bold;
        color: #fff;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .avatar-badge-btn {
        position: absolute;
        bottom: 2px;
        right: 2px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #1f5049;
        border: 2px solid #4ecdc4;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 15px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        transition: transform 0.15s ease, background 0.15s ease;
        padding: 0;
      }
      .avatar-wrapper:hover .avatar-badge-btn {
        transform: scale(1.12);
        background: #4ecdc4;
        color: #111;
      }
      .user-name {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 4px;
      }
      .username-tag {
        font-size: 14px;
        color: #4ecdc4;
        margin-bottom: 12px;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-bottom: 16px;
      }
      .badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
      }
      .badge-role {
        background: rgba(78, 205, 196, 0.15);
        color: #4ecdc4;
        border: 1px solid #4ecdc4;
      }
      .badge-status {
        background: rgba(255, 255, 255, 0.1);
        color: #ccc;
        border: 1px solid #555;
      }
      .field {
        display: grid;
        gap: 6px;
        margin: 14px 0;
        font-size: 13px;
        font-weight: bold;
      }
      .field input,
      .field textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #555;
        border-radius: 8px;
        background: #202228;
        color: #fff;
        font: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .field input:focus,
      .field textarea:focus {
        border-color: #4ecdc4;
        box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        outline: none;
      }
      .field textarea {
        min-height: 90px;
        resize: vertical;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 18px;
        border: 1px solid #fff;
        border-radius: 16px;
        background: #555;
        color: #fff;
        font-weight: bold;
        font-size: 13px;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      .button:hover {
        background: #777;
        transform: translateY(-1px);
      }
      .btn-save {
        background: #1f5049;
        border-color: #4ecdc4;
        color: #fff;
        padding: 9px 24px;
        font-size: 14px;
      }
      .btn-save:hover {
        background: #2a6960;
      }
      .btn-logout {
        width: 100%;
        background: #5a2828;
        border-color: #ff6b6b;
        margin-top: 10px;
      }
      .btn-logout:hover {
        background: #773333;
      }
      .btn-admin {
        width: 100%;
        margin-top: 10px;
        background: #2c5953;
        border-color: #4ecdc4;
      }
      .btn-admin:hover {
        background: #39736b;
      }
      [hidden] {
        display: none !important;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
        z-index: 1000;
        padding: 16px;
      }
      .modal-panel {
        width: min(92vw, 420px);
        background: #14161b;
        border: 2px solid #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
        padding: 20px;
        animation: popModal 0.18s ease-out;
      }
      @keyframes popModal {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
        padding-bottom: 12px;
        margin-bottom: 16px;
      }
      .modal-head h3 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.5px;
      }
      .btn-close {
        background: transparent;
        border: 0;
        color: #aaa;
        font-size: 18px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: color 0.15s ease, background 0.15s ease;
      }
      .btn-close:hover {
        color: #fff;
        background: #282a30;
      }
      .avatar-modal-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 8px 0;
      }
      .avatar-modal-preview-wrapper {
        margin-bottom: 14px;
      }
      .modal-avatar {
        width: 130px;
        height: 130px;
        font-size: 46px;
        pointer-events: none;
      }
      .modal-hint {
        color: #bbb;
        font-size: 13px;
        margin: 0 0 16px;
      }
      .modal-actions-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
      }
      .btn-danger-soft {
        background: #442222;
        border-color: #773333;
        color: #ff9999;
      }
      .btn-danger-soft:hover {
        background: #662b2b;
      }
      .modal-msg {
        font-size: 13px;
        margin: 10px 0 0;
        min-height: 18px;
        color: #4ecdc4;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid #333;
        padding-top: 14px;
        margin-top: 16px;
        width: 100%;
      }
      .btn-secondary {
        background: #333;
        border-color: #555;
      }
      .btn-secondary:hover {
        background: #444;
      }
      .button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }
      .message {
        min-height: 20px;
        color: #4ecdc4;
        margin-top: 10px;
        font-size: 13px;
      }
      @media (max-width: 768px) {
        .app {
          width: 100%;
          border: 0;
          padding: 8px;
        }
        .header {
          flex-wrap: wrap;
          gap: 8px;
        }
        nav {
          gap: 10px;
        }
        nav a {
          font-size: 11px;
        }
        .profile-layout {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .panel {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <a class="brand" href="../index.html"
          ><img src="../images/logo.jpg" alt="SmartFlea" /></a
        >
        <nav>
          <a href="../index.html">HOME</a>
          <a href="../doct.html">RECOMMENDED</a>
          <a href="about.html">CHATS</a>
          <a href="profile.html" class="active">PROFILE</a>
        </nav>
      </header>

      <h1 class="title">MY PROFILE</h1>

      <main class="profile-layout">
        <!-- Left Column: User Summary Card -->
        <section class="panel user-summary">
          <div class="avatar-wrapper" id="avatar-clickable" title="Click to change photo">
            <div id="avatar" class="avatar">?</div>
            <div class="avatar-overlay">
              <span class="avatar-pencil-center">✏️</span>
              <span class="avatar-overlay-text">Change</span>
            </div>
            <button type="button" class="avatar-badge-btn" aria-label="Change photo">✏️</button>
          </div>
          <div id="display-name-heading" class="user-name">Loading…</div>
          <div id="username" class="username-tag">@username</div>

          <div class="badges">
            <span id="role-badge" class="badge badge-role">User</span>
            <span id="status" class="badge badge-status">Online</span>
          </div>

          <a id="admin-console" class="button btn-admin" href="admin.html" hidden>
            ⚙️ OPEN ADMIN CONSOLE
          </a>

          <button id="logout" class="button btn-logout" type="button">
            🚪 Log out
          </button>
        </section>

        <!-- Right Column: Profile Edit Form -->
        <section class="panel">
          <h2>EDIT PROFILE DETAILS</h2>
          <form id="profile-form">
            <label class="field">
              Display name
              <input id="name" required placeholder="Your full name or nickname" />
            </label>

            <label class="field">
              Phone number
              <input id="phone" type="tel" placeholder="+380 …" />
            </label>

            <label class="field">
              About me / Bio
              <textarea
                id="bio"
                maxlength="250"
                placeholder="Tell something about yourself, tech stack, interests…"
              ></textarea>
            </label>

            <p id="message" class="message"></p>

            <div style="margin-top: 16px;">
              <button class="button btn-save" type="submit">Save profile</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <!-- Telegram-style Avatar Change Modal -->
    <div id="avatar-modal" class="modal" hidden>
      <div class="panel modal-panel">
        <div class="modal-head">
          <h3>Profile Photo</h3>
          <button id="close-avatar-modal" class="btn-close" type="button" aria-label="Close">✕</button>
        </div>

        <div class="avatar-modal-body">
          <div class="avatar-modal-preview-wrapper">
            <div id="modal-avatar-preview" class="avatar modal-avatar">?</div>
          </div>

          <p id="modal-avatar-hint" class="modal-hint">Choose a new photo from your device</p>

          <input id="modal-file-input" type="file" accept="image/*" style="display: none;" />

          <div class="modal-actions-row">
            <button id="modal-choose-btn" class="button" type="button">
              📁 Choose photo
            </button>
            <button id="modal-remove-btn" class="button btn-danger-soft" type="button">
              🗑️ Delete photo
            </button>
          </div>

          <p id="modal-msg" class="modal-msg"></p>
        </div>

        <div class="modal-footer">
          <button id="modal-cancel-btn" class="button btn-secondary" type="button">Cancel</button>
          <button id="modal-save-btn" class="button btn-save" type="button" disabled>
            Save photo
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        auth,
        db,
        doc,
        getDoc,
        updateDoc,
        serverTimestamp,
        onAuthStateChanged,
        signOut,
        updateProfile,
      } from "../firebase.js";

      const $ = (s) => document.querySelector(s);
      let user, profile;
      let stagedAvatarData = null;

      function compressImage(file, maxSize = 260, quality = 0.85) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = reject;
          reader.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
              const width = img.width;
              const height = img.height;
              const minDim = Math.min(width, height);
              const startX = (width - minDim) / 2;
              const startY = (height - minDim) / 2;

              const canvas = document.createElement("canvas");
              canvas.width = maxSize;
              canvas.height = maxSize;
              const ctx = canvas.getContext("2d");
              ctx.imageSmoothingQuality = "high";
              ctx.drawImage(
                img,
                startX,
                startY,
                minDim,
                minDim,
                0,
                0,
                maxSize,
                maxSize,
              );

              const dataUrl = canvas.toDataURL("image/jpeg", quality);
              resolve(dataUrl);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      onAuthStateChanged(auth, async (current) => {
        if (!current) {
          location.href = "login.html";
          return;
        }
        user = current;
        try {
          const snap = await getDoc(doc(db, "users", user.uid));
          profile = snap.data() || {};
          const displayName = profile.name || profile.fullName || "User";

          $("#name").value = displayName;
          $("#display-name-heading").textContent = displayName;
          $("#phone").value = profile.phone || "";
          $("#bio").value = profile.bio || "";
          $("#username").textContent = `@${profile.username || "user"}`;
          $("#status").textContent = profile.online ? "🟢 Online" : "⚪ Last seen recently";

          const role = profile.role || "user";
          $("#role-badge").textContent = role === "admin" ? "🛡️ Administrator" : "👤 Member";
          $("#admin-console").hidden = role !== "admin";

          renderAvatar(profile.avatarUrl, displayName);
        } catch (e) {
          console.warn("Could not load profile:", e);
        }
      });

      function renderAvatar(url, name, targetEl = $("#avatar")) {
        targetEl.innerHTML = url
          ? `<img src="${url}" alt="Avatar">`
          : (name || "?").slice(0, 1).toUpperCase();
      }

      // Open Avatar Modal
      $("#avatar-clickable").onclick = () => {
        stagedAvatarData = null;
        $("#modal-msg").textContent = "";
        $("#modal-avatar-hint").textContent = "Choose a new photo from your device";
        $("#modal-save-btn").disabled = true;
        $("#modal-save-btn").textContent = "Save photo";
        renderAvatar(profile?.avatarUrl, profile?.name || user?.displayName, $("#modal-avatar-preview"));
        $("#avatar-modal").hidden = false;
      };

      // Close modal
      const closeModal = () => {
        $("#avatar-modal").hidden = true;
        stagedAvatarData = null;
        $("#modal-file-input").value = "";
      };
      $("#close-avatar-modal").onclick = closeModal;
      $("#modal-cancel-btn").onclick = closeModal;

      // Choose photo button
      $("#modal-choose-btn").onclick = () => {
        $("#modal-file-input").click();
      };

      // File input change
      $("#modal-file-input").onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        $("#modal-avatar-hint").textContent = `Processing "${file.name}"…`;
        try {
          stagedAvatarData = await compressImage(file);
          renderAvatar(stagedAvatarData, "", $("#modal-avatar-preview"));
          $("#modal-avatar-hint").textContent = "Preview ready! Click 'Save photo' to apply.";
          $("#modal-save-btn").disabled = false;
          $("#modal-msg").textContent = "";
        } catch (err) {
          $("#modal-msg").textContent = "Could not process image file.";
        }
      };

      // Remove photo button
      $("#modal-remove-btn").onclick = () => {
        stagedAvatarData = "";
        const displayName = profile?.name || user?.displayName || "User";
        renderAvatar("", displayName, $("#modal-avatar-preview"));
        $("#modal-avatar-hint").textContent = "Photo will be removed. Initials will be used.";
        $("#modal-save-btn").disabled = false;
        $("#modal-msg").textContent = "";
      };

      // Save photo in modal
      $("#modal-save-btn").onclick = async () => {
        if (stagedAvatarData === null || !user) return;
        const saveBtn = $("#modal-save-btn");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        $("#modal-msg").textContent = "Saving avatar…";

        try {
          const newAvatarUrl = stagedAvatarData;
          await updateDoc(doc(db, "users", user.uid), {
            avatarUrl: newAvatarUrl,
            lastSeen: serverTimestamp(),
          });

          try {
            await updateProfile(user, { photoURL: newAvatarUrl });
          } catch {}

          profile = { ...profile, avatarUrl: newAvatarUrl };
          renderAvatar(newAvatarUrl, profile.name || user.displayName);
          $("#message").textContent = "✅ Avatar updated successfully!";
          closeModal();
        } catch (err) {
          console.error("Avatar save error:", err);
          $("#modal-msg").textContent = `Save failed: ${err.message || err.code}`;
          saveBtn.disabled = false;
          saveBtn.textContent = "Save photo";
        }
      };

      // Profile details form submit
      $("#profile-form").onsubmit = async (e) => {
        e.preventDefault();
        const name = $("#name").value.trim();
        const message = $("#message");
        message.textContent = "Saving profile…";

        try {
          const payload = {
            name,
            fullName: name,
            phone: $("#phone").value.trim(),
            bio: $("#bio").value.trim(),
            lastSeen: serverTimestamp(),
            online: true,
          };

          await updateDoc(doc(db, "users", user.uid), payload);
          try {
            await updateProfile(user, { displayName: name });
          } catch {}

          profile = { ...profile, ...payload };
          $("#display-name-heading").textContent = name;
          message.textContent = "✅ Profile updated successfully!";
        } catch (err) {
          message.textContent = `Could not save profile: ${err.message || err.code}`;
        }
      };

      $("#logout").onclick = async () => {
        if (user) {
          try {
            await updateDoc(doc(db, "users", user.uid), {
              online: false,
              lastSeen: serverTimestamp(),
            });
          } catch {}
        }
        await signOut(auth);
        location.href = "../index.html";
      };
    </script>
  </body>
</html>
