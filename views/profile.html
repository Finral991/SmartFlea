<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilSide — Profile</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000 url('../images/RSP.gif') repeat;color:#fff;font:15px Arial,sans-serif}.app{width:min(96vw,900px);min-height:100vh;margin:auto;padding:14px;background:rgba(0,0,0,.94);border-left:2px solid #fff;border-right:2px solid #fff}.header{display:flex;align-items:center;gap:10px;padding:5px 9px;border:2px solid #fff}.brand{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:bold}.brand img{width:47px;height:35px;object-fit:cover}nav{margin-left:auto;display:flex;gap:18px}nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:bold}.card{width:min(100%,640px);margin:35px auto;padding:18px;border:2px solid #fff;background:#080808}.card h1{text-align:center;margin:0 0 16px;font-size:21px}.profile-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}.avatar{display:grid;place-items:center;width:90px;height:90px;border-radius:50%;overflow:hidden;background:#ddd;color:#111;font-size:30px;font-weight:bold}.avatar img{width:100%;height:100%;object-fit:cover}.field{display:grid;gap:4px;margin:10px 0;font-size:12px;font-weight:bold}.field input,.field textarea{width:100%;border:2px solid #fff;border-radius:14px;background:#666;color:#fff;padding:7px 10px;font:inherit}.field textarea{min-height:70px;resize:vertical}.button{display:inline-block;padding:6px 14px;border:2px solid #fff;border-radius:15px;background:#777;color:#fff;font-weight:bold;text-decoration:none;cursor:pointer}.button:hover{background:#999}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.message{min-height:20px;color:#b9e2de;text-align:center}.logout{background:#4e3030}.admin{display:block;margin:16px 0 0;text-align:center;background:#426763}@media(max-width:560px){.app{width:100%;border:0;padding:8px}nav{gap:8px}nav a{font-size:9px}.card{margin:16px auto}.profile-top{align-items:flex-start}}
</style></head><body><div class="app"><header class="header"><a class="brand" href="../index.html"><img src="../images/logo.jpg">VEILSIDE</a><nav><a href="../index.html">HOME</a><a href="../doct.html">RECOMMENDED</a><a href="about.html">CHATS</a></nav></header><main class="card"><h1>MY PROFILE</h1><div class="profile-top"><div id="avatar" class="avatar">?</div><div><strong id="username">@username</strong><p id="status">Loading…</p><label class="button">Change avatar<input id="avatar-file" type="file" accept="image/*" hidden></label></div></div><form id="profile-form"><label class="field">Display name<input id="name" required></label><label class="field">Phone number<input id="phone" type="tel"></label><label class="field">About me<textarea id="bio" maxlength="250"></textarea></label><p id="message" class="message"></p><div class="actions"><button class="button" type="submit">Save profile</button><button id="logout" class="button logout" type="button">Log out</button></div></form><a id="admin-console" class="button admin" href="admin.html" hidden>OPEN ADMIN CONSOLE</a></main></div><script type="module">import {auth,db,storage,doc,getDoc,updateDoc,serverTimestamp,onAuthStateChanged,signOut,ref,uploadBytes,getDownloadURL,updateProfile} from '../firebase.js';const $=s=>document.querySelector(s);let user,profile,avatarFile;onAuthStateChanged(auth,async current=>{if(!current){location.href='login.html';return}user=current;const snap=await getDoc(doc(db,'users',user.uid));profile=snap.data();$('#name').value=profile.name||profile.fullName||'';$('#phone').value=profile.phone||'';$('#bio').value=profile.bio||'';$('#username').textContent=`@${profile.username}`;$('#status').textContent=profile.online?'Online':'Last seen recently';$('#admin-console').hidden=profile.role!=='admin';renderAvatar(profile.avatarUrl,profile.name||profile.fullName)});function renderAvatar(url,name){$('#avatar').innerHTML=url?`<img src="${url}" alt="Avatar">`:(name||'?').slice(0,1).toUpperCase()}$('#avatar-file').onchange=e=>{avatarFile=e.target.files[0];if(avatarFile)$('#message').textContent=`Ready to upload: ${avatarFile.name}`};$('#profile-form').onsubmit=async e=>{e.preventDefault();const name=$('#name').value.trim(),message=$('#message');message.textContent='Saving…';try{let avatarUrl=profile.avatarUrl||'';if(avatarFile){const fileRef=ref(storage,`avatars/${user.uid}/${Date.now()}-${avatarFile.name}`);await uploadBytes(fileRef,avatarFile);avatarUrl=await getDownloadURL(fileRef)}await updateDoc(doc(db,'users',user.uid),{name,fullName:name,phone:$('#phone').value.trim(),bio:$('#bio').value.trim(),avatarUrl,lastSeen:serverTimestamp(),online:true});await updateProfile(user,{displayName:name,photoURL:avatarUrl});profile={...profile,name,avatarUrl};renderAvatar(avatarUrl,name);message.textContent='Profile saved.'}catch{message.textContent='Could not save. Check Firebase Storage and Firestore rules.'}};$('#logout').onclick=async()=>{await updateDoc(doc(db,'users',user.uid),{online:false,lastSeen:serverTimestamp()});await signOut(auth);location.href='../index.html'}</script></body></html>
