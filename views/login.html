<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartFlea — Log in</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #07080a;
        background-image:
          radial-gradient(circle at 50% 0%, rgba(78, 205, 196, 0.09) 0%, transparent 55%),
          radial-gradient(circle at 100% 100%, rgba(31, 80, 73, 0.12) 0%, transparent 50%),
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
        background-attachment: fixed;
        color: #fff;
        font: clamp(13px, 1.1vw, 15px) Arial, sans-serif;
      }
      .app {
        width: min(96vw, 1240px);
        min-height: 100vh;
        margin: auto;
        padding: 16px;
        background: rgba(10, 10, 12, 0.95);
        border-left: 2px solid rgba(255, 255, 255, 0.85);
        border-right: 2px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px 12px;
        border: 2px solid #fff;
        border-radius: 8px;
        background: rgba(20, 20, 24, 0.7);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        letter-spacing: 0.5px;
      }
      .brand img {
        width: 46px;
        height: 34px;
        object-fit: cover;
        border-radius: 4px;
      }
      nav {
        display: flex;
        gap: clamp(10px, 1.6vw, 24px);
        margin-left: auto;
        align-items: center;
        white-space: nowrap;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        font-size: clamp(11px, 0.95vw, 13px);
        font-weight: bold;
        letter-spacing: 0.5px;
        transition: color 0.15s ease;
      }
      nav a:hover,
      nav a.active {
        color: #4ecdc4;
      }
      .login-container {
        max-width: 440px;
        margin: 50px auto;
        padding: 26px;
        border: 2px solid #fff;
        border-radius: 12px;
        background: #141418;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      }
      .login-container h1 {
        text-align: center;
        margin: 0 0 20px;
        font-size: 22px;
        letter-spacing: 1px;
      }
      label {
        display: grid;
        gap: 6px;
        margin: 14px 0;
        font-size: 13px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #555;
        border-radius: 8px;
        background: #202228;
        color: #fff;
        font: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      input:focus {
        border-color: #4ecdc4;
        box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        outline: none;
      }
      .form-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
      }
      button,
      .link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border: 1px solid #fff;
        border-radius: 16px;
        background: #555;
        color: #fff;
        font-weight: bold;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      button {
        background: #1f5049;
        border-color: #4ecdc4;
      }
      button:hover {
        background: #2a6960;
        transform: translateY(-1px);
      }
      .link {
        background: transparent;
        border-color: #777;
        color: #ccc;
        font-size: 13px;
      }
      .link:hover {
        background: #222;
        border-color: #fff;
        color: #fff;
      }
      #message {
        color: #ff6b6b;
        text-align: center;
        margin-top: 12px;
        font-size: 13px;
      }
      @media (max-width: 600px) {
        .app {
          width: 100%;
          border: 0;
          padding: 8px;
        }
        .header {
          flex-wrap: wrap;
          gap: 8px;
        }
        nav {
          gap: 10px;
        }
        nav a {
          font-size: 11px;
        }
        .login-container {
          margin: 20px auto;
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <a class="brand" href="../index.html"
          ><img src="../images/logo.jpg" alt="SmartFlea" />SMARTFLEA</a
        >
        <nav>
          <a href="../index.html">HOME</a>
          <a href="../doct.html">RECOMMENDED</a>
          <a href="about.html">CHATS</a>
          <a href="login.html" class="active">LOG IN</a>
        </nav>
      </header>

      <main class="login-container">
        <h1>LOG IN</h1>
        <form id="login-form">
          <label>
            Username
            <input id="login" placeholder="your_username" required autocomplete="username" />
          </label>
          <label>
            Password
            <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
          </label>
          <div class="form-buttons">
            <button type="submit">Sign In</button>
            <a class="link" href="register.html">Don't have an account? Register</a>
          </div>
          <p id="message"></p>
        </form>
      </main>
    </div>

    <script type="module">
      import {
        auth,
        db,
        doc,
        getDoc,
        updateDoc,
        serverTimestamp,
        signInWithEmailAndPassword,
      } from "../firebase.js";

      const form = document.querySelector("#login-form");
      const message = document.querySelector("#message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "Signing in…";
        message.style.color = "#4ecdc4";

        try {
          const username = document
            .querySelector("#login")
            .value.trim()
            .toLowerCase();
          const password = document.querySelector("#password").value;

          const usernameDoc = await getDoc(doc(db, "usernames", username));
          if (!usernameDoc.exists()) {
            throw new Error("Unknown username");
          }

          const credentials = await signInWithEmailAndPassword(
            auth,
            usernameDoc.data().email,
            password,
          );

          await updateDoc(doc(db, "users", credentials.user.uid), {
            online: true,
            lastSeen: serverTimestamp(),
          });

          location.href = "../index.html";
        } catch {
          message.style.color = "#ff6b6b";
          message.textContent = "Invalid username or password.";
        }
      });
    </script>
  </body>
</html>
