<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeilSide</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000 url('images/RSP.gif') repeat;color:#fff;font:clamp(13px,1.1vw,16px) Arial,sans-serif}.app{width:min(96vw,1240px);min-height:100vh;margin:auto;padding:14px;background:rgba(0,0,0,.94);border-left:2px solid #fff;border-right:2px solid #fff}.header{display:flex;align-items:center;gap:12px;padding:5px 9px;border:2px solid #fff}.brand{display:flex;align-items:center;gap:7px;color:#fff;text-decoration:none;font-weight:bold}.brand img{width:47px;height:35px;object-fit:cover}nav{display:flex;flex-wrap:nowrap;gap:clamp(9px,1.5vw,22px);margin-left:auto;white-space:nowrap}nav span{display:contents}nav a{color:#fff;text-decoration:none;font-size:clamp(10px,.9vw,14px);font-weight:bold}.banner{display:block;height:clamp(140px,19vw,240px);margin-top:12px;border:2px solid #fff;background:center/cover url('images/00.jpg');animation:cars 45s infinite}@keyframes cars{0%,18%{background-image:url('images/00.jpg')}25%,43%{background-image:url('images/25.jpg')}50%,68%{background-image:url('images/42.jpg')}75%,100%{background-image:url('images/77.jpg')}}.title{text-align:center;margin:16px 0 8px;font-size:clamp(16px,1.5vw,21px)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1vw,14px)}.card{padding:5px;border:2px solid #fff;background:#fff;color:#111;text-decoration:none}.card:hover{outline:2px solid #b9e2de}.card img{display:block;width:100%;aspect-ratio:1/.79;object-fit:cover}.card strong{display:block;margin-top:5px}.person{display:grid;justify-items:center;gap:7px;min-height:130px;padding:10px;border:2px solid #fff;color:#fff;text-decoration:none}.avatar{display:grid;place-items:center;width:clamp(62px,7vw,90px);height:clamp(62px,7vw,90px);overflow:hidden;border-radius:50%;background:#ddd;color:#111;font-size:22px;font-weight:bold}.avatar img{width:100%;height:100%;object-fit:cover}.empty{grid-column:1/-1;padding:25px;text-align:center;color:#bbb}footer{margin-top:15px;padding:9px;border:2px solid #fff;font-size:10px;line-height:1.5}.background-control{position:fixed;right:12px;bottom:12px;padding:6px 9px;border:1px solid #fff;border-radius:14px;background:#111;color:#fff;font-size:10px;cursor:pointer}.background-control input{display:none}@media(max-width:560px){.app{width:100%;border:0;padding:8px}.header{gap:6px}.brand img{width:38px;height:28px}nav{gap:7px}nav a{font-size:9px}.banner{height:85px}.grid{gap:7px}.card{padding:3px}.card strong{font-size:10px}.person{min-height:96px}}
</style></head><body><div class="app"><header class="header"><a class="brand" href="index.html"><img src="images/logo.jpg">VEILSIDE</a><nav><a href="index.html">HOME</a><a href="doct.html">RECOMMENDED</a><a href="views/about.html">CHATS</a><span data-account-nav><a href="views/login.html">LOG IN</a></span></nav></header><main><a class="banner" href="doct.html"></a><h1 class="title">RECOMMENDED</h1><section id="posts" class="grid"><p class="empty">Loading posts…</p></section><h2 class="title">CHATS</h2><section id="people" class="grid"><p class="empty">Sign in to see registered users.</p></section></main><footer>© 2026 VeilSide. All Rights Reserved.<br>123 Main Street · smartflea@company.com</footer></div><label class="background-control">BACKGROUND<input id="background" type="file" accept="image/*"></label><script type="module">import {attachAccountNav} from './account-nav.js';import {auth,db,collection,getDocs,onAuthStateChanged} from './firebase.js';attachAccountNav('');const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const stored=localStorage.getItem('veilside-background');if(stored)document.body.style.backgroundImage=`url(${stored})`;$('#background').onchange=e=>{const r=new FileReader();if(e.target.files[0]){r.onload=()=>{localStorage.setItem('veilside-background',r.result);document.body.style.backgroundImage=`url(${r.result})`};r.readAsDataURL(e.target.files[0])}};async function render(){try{const posts=(await getDocs(collection(db,'posts'))).docs.map(d=>({id:d.id,...d.data()})).slice(0,9);$('#posts').innerHTML=posts.length?posts.map(p=>`<a class="card" href="doct.html?post=${p.id}"><img src="${p.imageUrl}" alt="${esc(p.title)}"><strong>${esc(p.title)}</strong></a>`).join(''):'<p class="empty">No posts yet — add one in Admin Console.</p>'}catch(e){$('#posts').innerHTML='<p class="empty">Posts unavailable. Publish Firestore rules for posts.</p>'}};onAuthStateChanged(auth,async user=>{render();if(!user)return;try{const people=(await getDocs(collection(db,'users'))).docs.filter(d=>d.id!==user.uid).map(d=>({id:d.id,...d.data()})).slice(0,6);$('#people').innerHTML=people.length?people.map(p=>`<a class="person" href="views/about.html?user=${p.id}"><span class="avatar">${p.avatarUrl?`<img src="${p.avatarUrl}">`:esc((p.name||p.fullName||'?')[0])}</span><strong>${esc(p.name||p.fullName)}</strong></a>`).join(''):'<p class="empty">No other registered users yet.</p>'}catch(e){$('#people').innerHTML='<p class="empty">Users unavailable. Publish Firestore rules for users.</p>'}});</script></body></html>
