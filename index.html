<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Flea — Блог про комп'ютерні технології</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-bar">
        <div class="logo">⚡ Smart Flea</div>
        <nav class="nav-links">
            <a href="#" class="active">Статті</a>
            <a href="#">Залізо</a>

        </nav>
        <button id="theme-toggle" class="icon-btn" title="Змінити тему">🌙</button>

        <section class="hero-card">
            <h1>Технології простими словами</h1>

        <section id="posts-grid" class="posts-grid">
            <!-- Статті підвантажуються через script.js -->
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Smart Flea Blog. Лабораторний проєкт.</p>
    </footer>

    <script src="script.js"></script>
